events {}

http {
    client_max_body_size 10M;

    upstream app {
        sticky cookie srv_id;

        server app1:3000;
        server app2:3000;
    }

    # =========================================================
    # PUBLIC HTTP SERVER
    # =========================================================
    #
    # HTTP is only used for:
    # 1. Let's Encrypt ACME challenges
    # 2. Redirecting normal traffic to HTTPS
    #
    server {
        listen 80;
        server_name sculwave.com www.sculwave.com;

        # Let's Encrypt HTTP-01 challenge
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # Everything else -> HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }


    # =========================================================
    # PUBLIC HTTPS SERVER
    # =========================================================
    #
    # Normal SculWave application is public.
    # Telemetry remains blocked publicly.
    #
    server {
        listen 443 ssl;
        server_name sculwave.com www.sculwave.com;

        ssl_certificate /etc/letsencrypt/live/sculwave.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sculwave.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        # -----------------------------------------------------
        # Block telemetry dashboard publicly
        # -----------------------------------------------------

        location /telemetry {
            return 403;
        }

        # -----------------------------------------------------
        # Block telemetry API publicly
        # -----------------------------------------------------

        location /api/telemetry/ {
            return 403;
        }

        # -----------------------------------------------------
        # Everything else
        # -----------------------------------------------------

        location / {
            proxy_pass http://app;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Explicitly mark this as NOT a trusted telemetry request.
            proxy_set_header X-Telemetry-Client-IP "";

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            proxy_socket_keepalive on;
        }
    }



    # =========================================================
    # MEDIA HTTP SERVER
    # =========================================================
    #
    # Used for:
    # 1. Let's Encrypt ACME challenge
    # 2. Redirecting normal media traffic to HTTPS
    #
    server {
        listen 80;
        server_name media.sculwave.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

        # =========================================================
    # PUBLIC MEDIA HTTPS SERVER
    # =========================================================

    server {
        listen 443 ssl;
        server_name media.sculwave.com;

        ssl_certificate /etc/letsencrypt/live/media.sculwave.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/media.sculwave.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://app;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_http_version 1.1;
            proxy_buffering off;
        }
    }
        # =========================================================
    # PUBLIC LIVEKIT WEBSOCKET SERVER
    # =========================================================

    server {
        listen 443 ssl;
        server_name livekit.sculwave.com;

        ssl_certificate /etc/letsencrypt/live/livekit.sculwave.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/livekit.sculwave.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://livekit:7880;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
    listen 80;
    server_name livekit.sculwave.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }


    
}


    # =========================================================
    # PRIVATE TAILSCALE SERVER
    # =========================================================
    #
    # Host binding:
    #   100.78.163.26:8080
    #
    # This listener remains HTTP and is only exposed through
    # the Tailscale address by Docker.
    #
    server {
        listen 8080;

        location /telemetry {
            proxy_pass http://app;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/telemetry/ {
            proxy_pass http://app;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /socket.io/ {
            proxy_pass http://app;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /health {
            proxy_pass http://app;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_next/ {
            proxy_pass http://app;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 403;
        }
    }
}