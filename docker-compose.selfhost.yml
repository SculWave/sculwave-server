# Self-hosted (community) edition: single node, no billing/telemetry; local dashboard password auth.
#
#   cp .env.example .env            # edit it
#   docker compose -f docker-compose.selfhost.yml up -d --build
#   -> open http://localhost:3000
#
# Want HTTPS on your own domain? Also enable the "domain" profile:
#   docker compose -f docker-compose.selfhost.yml --profile domain up -d --build
#
name: sculwave-selfhost

services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      SELF_HOSTED: "true"
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      DATABASE_URL: postgresql://sculwave:${POSTGRES_PASSWORD}@postgres:5432/sculwave
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUB_URL: ${LIVEKIT_PUB_URL:-ws://localhost:7880}
      MEDIA_STORAGE_DIR: /app/data/media
    volumes:
      - ./data/media:/app/data/media
    ports:
      # 127.0.0.1 = this machine only. Keep local-only unless HTTPS and network access are configured.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      livekit:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sculwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sculwave
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sculwave"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./docker/livekit/livekit.selfhost.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "${LIVEKIT_BIND:-127.0.0.1}:7880:7880/tcp"
    depends_on:
      - redis
    restart: unless-stopped
  # Optional HTTPS front door for a real domain (profile: domain).
  caddy:
    profiles: ["domain"]
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - livekit
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
